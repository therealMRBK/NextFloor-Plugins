name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate.mjs
      # the furniture packs through NextFloor's own import check
      - uses: actions/checkout@v4
        with:
          repository: therealMRBK/NextFloor
          ref: main
          path: nextfloor
          sparse-checkout: custom_components/nextfloor/packs.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install voluptuous && python3 scripts/check_packs.py nextfloor
